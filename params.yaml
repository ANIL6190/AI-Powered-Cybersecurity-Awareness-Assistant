# Phase 1 configuration — binary URL phishing classification (phishing vs legitimate).
# Every value here is read by a pipeline stage and declared in dvc.yaml.
# The legacy 3-class Stage 1 configuration is preserved in archive/legacy_stage1_params.yaml.

base:
  random_seed: 42
  log_level: INFO

task:
  name: binary_url_phishing
  # SMSSpamCollection is DVC-versioned for provenance only. It labels spam/ham, not phishing,
  # so it is excluded; setting this to true raises an error rather than mapping spam -> phishing.
  include_sms: false

raw_data:
  phiusiil_path: data/raw/PhiUSIIL_Phishing_URL_Dataset.csv
  phishvn_dir: data/raw/phishvn_v3.1.0
  phishvn_path: data/raw/phishvn_v3.1.0/dataset_url.csv
  sms_path: data/raw/SMSSpamCollection

url:
  # canonical_url: host + path/query (scheme, leading www and trailing slash removed)
  # host_only:     host without www (removes the path signal entirely)
  representation: canonical_url
  strip_scheme: true
  strip_www: true
  strip_trailing_slash: true
  min_length: 4
  # true = use the Public Suffix List private section, so each tenant of a hosting platform
  # (x.web.app, y.firebaseapp.com, z.workers.dev) is its own group, as the PSL intends.
  # With false, all tenants of one platform collapse into a single group of thousands of
  # phishing rows, which skewed the class ratio between splits (train 44% vs test 35% phishing).
  include_psl_private_domains: true

phishvn:
  # gold/silver = verified core. bronze (ChongLuaDao/OpenPhish) is community-labelled, ~12% label
  # noise per the PhishVN audit, and its dates are reconstructed, so it is excluded.
  tiers: [gold, silver]
  positive_value: phishing
  negative_value: benign
  timestamp_column: collected_at
  timestamp_format: "%d/%m/%Y"
  # Sources whose collected_at is an event date attested by the source itself:
  #   tinnhiemmang = NCSC blacklist detection date (phishing)
  #   tinnhiem_org = NCSC trusted-organisation certification date (legitimate)
  # scraped_at is a fetch time and is never used.
  attested_date_sources: [tinnhiemmang, tinnhiem_org]

temporal:
  # Split point INSIDE the dated PhishVN subset (source-attested NCSC dates): rows after it form
  # temporal_test, rows on/before it are the "older" comparison group. It divides the NCSC phishing
  # rows roughly 85/15 (2,186 vs 370). It is NOT a claim about when PhiUSIIL was collected: PhiUSIIL
  # has no row-level dates, and the 2024-03-08 timestamp of its file inside the Kaggle ZIP is only a
  # file artefact. No claim is made that post-split PhishVN rows are newer than the training data.
  cutoff_date: "2024-03-08"

split:
  # Applied to the PhiUSIIL pool; whole registrable-domain groups are assigned to one split.
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  group_by: registrable_domain

validation:
  # Maximum allowed absolute difference in phishing rate between train and val/test.
  max_class_ratio_drift: 0.05
  min_temporal_rows: 50

features:
  tfidf:
    analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 3
    max_features: 100000
    sublinear_tf: true
    lowercase: true

models:
  logreg:
    C: 4.0
    solver: liblinear
    max_iter: 2000
    class_weight: balanced
  xgboost:
    # Selected by validation PR-AUC from a small experiment (reports/phase1/variants/xgb_*):
    #   lr0.1/depth6 (original) 0.9258 | lr0.3 0.9309 | lr0.3+colsample0.4 0.9316 | lr0.3+depth10 0.9317
    # The three lr0.3 settings are within noise; lr0.3+depth10 is the only one where early stopping triggered.
    n_estimators: 600
    max_depth: 10
    learning_rate: 0.3
    subsample: 0.8
    # With 100k sparse TF-IDF columns, per-node histograms dominate the cost:
    # colsample_bytree 0.5 / max_bin 256 ran >20 min without finishing; 0.2 / 32 is ~30x faster.
    colsample_bytree: 0.2
    max_bin: 32
    min_child_weight: 1
    reg_lambda: 1.0
    tree_method: hist
    early_stopping_rounds: 30
    # scale_pos_weight = (#legitimate / #phishing) in train, computed at train time
    balance_classes: true
    n_jobs: -1

evaluation:
  threshold: 0.5

mlflow:
  experiment_name: phase1-url-phishing
  # Tag/run-name prefix that distinguishes experiment variants (scripts/run_variant.py) from the main pipeline.
  variant: main
  tracking_uri_env: MLFLOW_TRACKING_URI
  default_tracking_uri: sqlite:///mlflow.db
  local_artifact_root: mlartifacts
  log_models: true
  # skops (MLflow's safe default) takes minutes and tens of MB for a 100k-term vocabulary.
  # cloudpickle artifacts must only be loaded from a trusted tracking store.
  model_serialization: cloudpickle

output:
  processed_dir: data/processed/phase1
  features_dir: data/processed/phase1/features
  models_dir: models
  reports_dir: reports/phase1
